; thronectl firmware for M5Stack Cardputer ADV (StampS3A, ESP32-S3FN8, 8 MB flash, no PSRAM)
[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.10.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
board_build.f_cpu = 240000000L
monitor_speed = 115200
lib_deps =
  m5stack/M5Cardputer@1.1.1
  m5stack/M5Unified@0.2.27
  m5stack/M5GFX@0.2.34
  bblanchon/ArduinoJson@^7.3.0
  h2zero/NimBLE-Arduino@2.5.1
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -O2
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=1
  ; Bluetooth: one peripheral link to the host, no central or scanner roles
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
  -DCONFIG_BT_NIMBLE_MAX_BONDS=1
  -DCONFIG_BT_NIMBLE_MAX_CCCDS=2
  -DCONFIG_BT_NIMBLE_ATT_PREFERRED_MTU=247
  -DCONFIG_BT_NIMBLE_LOG_LEVEL=5
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
